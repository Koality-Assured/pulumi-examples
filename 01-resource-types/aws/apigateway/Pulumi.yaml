name: aws-apigateway-rest
description: AWS API Gateway v1 REST API with resource trees, GET/POST methods, mock & lambda integrations, and deployment stages
runtime: yaml

variables:
  stageName: v1

resources:
  # 1. Core REST API
  restApi:
    type: aws:apigateway:RestApi
    properties:
      name: apigw-platform-service-prod
      description: Production REST API gateway for microservice edge routing
      endpointConfiguration:
        types: REGIONAL
      tags:
        Environment: Production
        ManagedBy: Pulumi

  # 2. Resource Hierarchy: /api
  apiResource:
    type: aws:apigateway:Resource
    properties:
      restApi: ${restApi.id}
      parentId: ${restApi.rootResourceId}
      pathPart: api

  # 3. Resource Hierarchy: /api/v1
  v1Resource:
    type: aws:apigateway:Resource
    properties:
      restApi: ${restApi.id}
      parentId: ${apiResource.id}
      pathPart: v1

  # 4. Resource: /api/v1/health
  healthResource:
    type: aws:apigateway:Resource
    properties:
      restApi: ${restApi.id}
      parentId: ${v1Resource.id}
      pathPart: health

  # 5. Method: GET /api/v1/health
  healthGetMethod:
    type: aws:apigateway:Method
    properties:
      restApi: ${restApi.id}
      resourceId: ${healthResource.id}
      httpMethod: GET
      authorization: NONE

  # 6. Mock Integration for Health Check (Static 200 JSON Response)
  healthIntegration:
    type: aws:apigateway:Integration
    properties:
      restApi: ${restApi.id}
      resourceId: ${healthResource.id}
      httpMethod: ${healthGetMethod.httpMethod}
      type: MOCK
      requestTemplates:
        application/json: '{"statusCode": 200}'

  healthMethodResponse:
    type: aws:apigateway:MethodResponse
    properties:
      restApi: ${restApi.id}
      resourceId: ${healthResource.id}
      httpMethod: ${healthGetMethod.httpMethod}
      statusCode: "200"
      responseModels:
        application/json: "Empty"

  healthIntegrationResponse:
    type: aws:apigateway:IntegrationResponse
    properties:
      restApi: ${restApi.id}
      resourceId: ${healthResource.id}
      httpMethod: ${healthGetMethod.httpMethod}
      statusCode: ${healthMethodResponse.statusCode}
      responseTemplates:
        application/json: '{"status": "healthy", "service": "apigw-platform"}'
    options:
      dependsOn:
        - ${healthIntegration}

  # 7. Deployment (Snapshot of API state)
  apiDeployment:
    type: aws:apigateway:Deployment
    properties:
      restApi: ${restApi.id}
    options:
      dependsOn:
        - ${healthIntegrationResponse}

  # 8. Stage (Exposes Deployment at URL prefix)
  apiStage:
    type: aws:apigateway:Stage
    properties:
      restApi: ${restApi.id}
      deployment: ${apiDeployment.id}
      stageName: ${stageName}
      tags:
        Environment: Production

outputs:
  apiId: ${restApi.id}
  apiEndpointUrl: ${restApi.executionArn}
  healthCheckUrl: https://${restApi.id}.execute-api.us-west-2.amazonaws.com/${stageName}/api/v1/health
