name: aws-networking-foundation
description: Production-grade AWS networking foundation (VPC, multi-AZ public/private subnets, NAT/IGW, route tables, and security groups)
runtime: yaml

variables:
  vpcCidr: 10.100.0.0/16
  publicSubnetACidr: 10.100.1.0/24
  publicSubnetBCidr: 10.100.2.0/24
  privateSubnetACidr: 10.100.10.0/24
  privateSubnetBCidr: 10.100.20.0/24
  primaryAz: us-west-2a
  secondaryAz: us-west-2b

resources:
  # 1. Virtual Private Cloud (VPC)
  primaryVpc:
    type: aws:ec2:Vpc
    properties:
      cidrBlock: ${vpcCidr}
      enableDnsHostnames: true
      enableDnsSupport: true
      instanceTenancy: default
      tags:
        Name: vpc-primary-prod
        Environment: Production
        ManagedBy: Pulumi
        Service: CoreNetworking

  # 2. Internet Gateway (IGW) for public egress/ingress
  internetGateway:
    type: aws:ec2:InternetGateway
    properties:
      vpcId: ${primaryVpc.id}
      tags:
        Name: igw-primary-prod
        Environment: Production

  # 3. Multi-AZ Public Subnets (Required for Application Load Balancers)
  publicSubnetA:
    type: aws:ec2:Subnet
    properties:
      vpcId: ${primaryVpc.id}
      cidrBlock: ${publicSubnetACidr}
      availabilityZone: ${primaryAz}
      mapPublicIpOnLaunch: false # Defense-in-depth: do not auto-assign public IPs by default
      tags:
        Name: snet-public-usw2a
        Tier: Public
        Environment: Production

  publicSubnetB:
    type: aws:ec2:Subnet
    properties:
      vpcId: ${primaryVpc.id}
      cidrBlock: ${publicSubnetBCidr}
      availabilityZone: ${secondaryAz}
      mapPublicIpOnLaunch: false
      tags:
        Name: snet-public-usw2b
        Tier: Public
        Environment: Production

  # 4. Public Route Table & Default Route to IGW
  publicRouteTable:
    type: aws:ec2:RouteTable
    properties:
      vpcId: ${primaryVpc.id}
      routes:
        - cidrBlock: 0.0.0.0/0
          gatewayId: ${internetGateway.id}
      tags:
        Name: rtb-public-prod
        Tier: Public

  publicRouteTableAssocA:
    type: aws:ec2:RouteTableAssociation
    properties:
      subnetId: ${publicSubnetA.id}
      routeTableId: ${publicRouteTable.id}

  publicRouteTableAssocB:
    type: aws:ec2:RouteTableAssociation
    properties:
      subnetId: ${publicSubnetB.id}
      routeTableId: ${publicRouteTable.id}

  # 5. Elastic IP for NAT Gateway
  natEip:
    type: aws:ec2:Eip
    properties:
      domain: vpc
      tags:
        Name: eip-nat-usw2a
        Environment: Production

  # 6. NAT Gateway for Private Subnet outbound access
  natGateway:
    type: aws:ec2:NatGateway
    properties:
      allocationId: ${natEip.id}
      subnetId: ${publicSubnetA.id}
      connectivityType: public
      tags:
        Name: nat-gw-usw2a
        Environment: Production
    options:
      dependsOn:
        - ${internetGateway}

  # 7. Multi-AZ Private Subnets
  privateSubnetA:
    type: aws:ec2:Subnet
    properties:
      vpcId: ${primaryVpc.id}
      cidrBlock: ${privateSubnetACidr}
      availabilityZone: ${primaryAz}
      mapPublicIpOnLaunch: false
      tags:
        Name: snet-private-usw2a
        Tier: Private
        Environment: Production

  privateSubnetB:
    type: aws:ec2:Subnet
    properties:
      vpcId: ${primaryVpc.id}
      cidrBlock: ${privateSubnetBCidr}
      availabilityZone: ${secondaryAz}
      mapPublicIpOnLaunch: false
      tags:
        Name: snet-private-usw2b
        Tier: Private
        Environment: Production

  # 8. Private Route Table & Default Route to NAT Gateway
  privateRouteTable:
    type: aws:ec2:RouteTable
    properties:
      vpcId: ${primaryVpc.id}
      routes:
        - cidrBlock: 0.0.0.0/0
          natGatewayId: ${natGateway.id}
      tags:
        Name: rtb-private-prod
        Tier: Private

  privateRouteTableAssocA:
    type: aws:ec2:RouteTableAssociation
    properties:
      subnetId: ${privateSubnetA.id}
      routeTableId: ${privateRouteTable.id}

  privateRouteTableAssocB:
    type: aws:ec2:RouteTableAssociation
    properties:
      subnetId: ${privateSubnetB.id}
      routeTableId: ${privateRouteTable.id}

  # 9. Baseline Application Security Group
  appSecurityGroup:
    type: aws:ec2:SecurityGroup
    properties:
      name: sg-app-workload-prod
      description: Security group for internal application tier workloads
      vpcId: ${primaryVpc.id}
      ingress:
        - description: Allow TLS from within VPC CIDR
          fromPort: 443
          toPort: 443
          protocol: tcp
          cidrBlocks:
            - ${vpcCidr}
      egress:
        - description: Allow outbound HTTPS for updates and external APIs
          fromPort: 443
          toPort: 443
          protocol: tcp
          cidrBlocks:
            - 0.0.0.0/0
      tags:
        Name: sg-app-workload-prod
        Environment: Production

outputs:
  vpcId: ${primaryVpc.id}
  vpcCidrBlock: ${primaryVpc.cidrBlock}
  publicSubnetAId: ${publicSubnetA.id}
  publicSubnetBId: ${publicSubnetB.id}
  privateSubnetAId: ${privateSubnetA.id}
  privateSubnetBId: ${privateSubnetB.id}
  publicSubnetIds:
    - ${publicSubnetA.id}
    - ${publicSubnetB.id}
  privateSubnetIds:
    - ${privateSubnetA.id}
    - ${privateSubnetB.id}
  natGatewayId: ${natGateway.id}
  appSecurityGroupId: ${appSecurityGroup.id}
