<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Tech Matrix Blueprint Grid -->
  <g opacity="0.12" stroke="#8B5CF6" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <!-- High-Tech Data Stream Vectors -->
  <g opacity="0.25">
    <path d="M -50 100 Q 300 60 640 180 T 1330 220" fill="none" stroke="#8B5CF6" stroke-width="2" />
    <path d="M -50 280 Q 400 340 780 240 T 1330 140" fill="none" stroke="#00F0FF" stroke-width="2" />
  </g>

  <!-- Left: Hero Graphic Emblematics -->
  <g transform="translate(180, 200)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.6" />
    
    <!-- Outer Spoke Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#8B5CF6" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#00F0FF" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#10B981" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#8B5CF6" stroke-width="3" />

    <!-- Central Iconography Transformed -->
    <g transform="translate(-256, -256)">

    <!-- Infrastructure as Code Stacked Layers Motif -->
    <!-- Top Layer: App & Policy Layer -->
    <polygon points="256,155 345,195 256,235 167,195" fill="#0F172A" stroke="#10B981" stroke-width="4" />
    <polygon points="256,165 325,195 256,225 187,195" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6" />
    <!-- Middle Layer: Compute & Security Layer -->
    <polygon points="256,210 345,250 256,290 167,250" fill="#0F172A" stroke="#8B5CF6" stroke-width="4" />
    <!-- Bottom Layer: Base Network & Cloud Foundation -->
    <polygon points="256,265 345,305 256,345 167,305" fill="#0F172A" stroke="#00F0FF" stroke-width="4" />
    <!-- Vertical Interconnect Data Buses -->
    <line x1="167" y1="195" x2="167" y2="305" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="345" y1="195" x2="345" y2="305" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="256" y1="235" x2="256" y2="345" stroke="#10B981" stroke-width="3" />
    <circle cx="256" cy="195" r="7" fill="#10B981" />
        
    </g>
  </g>

  <!-- Right: Typography & Capability Badges -->
  <g transform="translate(420, 100)">
    <!-- Overline Category Capsule -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#8B5CF6" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • PULUMI ARCHITECTURE</text>

    <!-- Project Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">PULUMI INFRASTRUCTURE EXAMPLES</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Production-Grade Multi-Cloud IaC Patterns, Policy-as-Code &amp; Matrixed Automations</text>

    <!-- Capability Chips -->
    <g transform="translate(0, 150)">
      <!-- Chip 1: Multi-Cloud IaC -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="183" height="38" rx="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#8B5CF6" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Multi-Cloud IaC</text>
      </g>
      <!-- Chip 2: Pulumi YAML/Python -->
      <g transform="translate(197, 0)">
        <rect x="0" y="0" width="210" height="38" rx="8" fill="#111827" stroke="#00F0FF" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#00F0FF" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Pulumi YAML/Python</text>
      </g>
      <!-- Chip 3: CrossGuard Policies -->
      <g transform="translate(421, 0)">
        <rect x="0" y="0" width="219" height="38" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#10B981" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">CrossGuard Policies</text>
      </g>
      <!-- Chip 4: Serverless Stacks -->
      <g transform="translate(654, 0)">
        <rect x="0" y="0" width="201" height="38" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#38BDF8" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Serverless Stacks</text>
      </g>
    </g>
  </g>
</svg>
