<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Geometric Orbit Tracks -->
  <g opacity="0.2" stroke="#475569" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
  </g>

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" stroke-dasharray="40 20 80 20" />
  <g fill="#0B0F19" stroke-width="3">
    <circle cx="256" cy="71" r="14" stroke="#8B5CF6" />
    <circle cx="256" cy="71" r="5" fill="#8B5CF6" />
    <circle cx="441" cy="256" r="14" stroke="#00F0FF" />
    <circle cx="441" cy="256" r="5" fill="#00F0FF" />
    <circle cx="256" cy="441" r="14" stroke="#10B981" />
    <circle cx="256" cy="441" r="5" fill="#10B981" />
    <circle cx="71" cy="256" r="14" stroke="#8B5CF6" />
    <circle cx="71" cy="256" r="5" fill="#8B5CF6" />
  </g>

  <!-- Central Emblem Geometry -->
  <g filter="url(#glow)">

    <!-- Infrastructure as Code Stacked Layers Motif -->
    <!-- Top Layer: App & Policy Layer -->
    <polygon points="256,155 345,195 256,235 167,195" fill="#0F172A" stroke="#10B981" stroke-width="4" />
    <polygon points="256,165 325,195 256,225 187,195" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6" />
    <!-- Middle Layer: Compute & Security Layer -->
    <polygon points="256,210 345,250 256,290 167,250" fill="#0F172A" stroke="#8B5CF6" stroke-width="4" />
    <!-- Bottom Layer: Base Network & Cloud Foundation -->
    <polygon points="256,265 345,305 256,345 167,305" fill="#0F172A" stroke="#00F0FF" stroke-width="4" />
    <!-- Vertical Interconnect Data Buses -->
    <line x1="167" y1="195" x2="167" y2="305" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="345" y1="195" x2="345" y2="305" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="256" y1="235" x2="256" y2="345" stroke="#10B981" stroke-width="3" />
    <circle cx="256" cy="195" r="7" fill="#10B981" />
        
  </g>

  <!-- Bus Trajectory Pulses -->
  <circle cx="176" cy="134" r="4" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="336" cy="134" r="4" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="336" cy="378" r="4" fill="#10B981" filter="url(#glow)" />
  <circle cx="176" cy="378" r="4" fill="#8B5CF6" filter="url(#glow)" />
</svg>
